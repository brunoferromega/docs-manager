# Database only. Spring Boot's Docker Compose support starts this file when the application runs
# locally (bootRun / IDE), so the API itself stays on the host instead of being containerised twice.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bruno
      POSTGRES_PASSWORD: bruno
      POSTGRES_DB: docs_storage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U bruno -d docs_storage" ]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      org.springframework.boot.service-connection: postgres

volumes:
  pgdata:
